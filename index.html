<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexurgir | Nicaragua Hardcore</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Fuente H2 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Burned&family=Sancreek&display=swap" rel="stylesheet">
    <!-- Fuente letras -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300&display=swap" rel="stylesheet">
</head>

<body>
    <!-- HEADER -->
    <header id="header">
        <div class="cabecera">
            <a href="#portada">
                <img rel="preload" src="img/cabecera.png" alt="Logo">
            </a>
        </div>
        <!-- Menú de navegación para escritorio -->
        <nav class="menu">
            <ul>
                <li><a href="#portada">INICIO</a></li>
                <li><a href="#historia">HISTORIA</a></li>
                <li><a href="#musica">MÚSICA</a></li>
                <li><a href="#conciertos">CONCIERTOS</a></li>
                <li><a href="#contacto">CONTACTO</a></li>
            </ul>
        </nav>

        <!-- Icono de hamburguesa (solo visible en móvil) -->
        <div class="hamburger" id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>

        <!-- Menú móvil oculto inicialmente -->
        <div class="mobile-menu" id="mobileMenu">
            <ul>
                <li><a href="#portada">INICIO</a></li>
                <li><a href="#historia">HISTORIA</a></li>
                <li><a href="#musica">MÚSICA</a></li>
                <li><a href="#conciertos">CONCIERTOS</a></li>
                <li><a href="#contacto">CONTACTO</a></li>
            </ul>
        </div>
    </header>
    <!-- Contenedor principal con el fondo de video -->
    <section id="portada" class="seccion portada">
        <!-- Video de fondo -->
        <video id="video-portada" autoplay muted loop playsinline class="background-video">
            <source id="video-source" type="video/mp4">
            Tu navegador no soporta el video.
        </video>

        <!-- Logo en el centro -->
        <div class="logo">
            <img id="hero-imagen" alt="Logo">
        </div>

        <!-- Plataformas musicales abajo -->
        <div class="platforms">
            <a class="social-link facebook" data-red="facebook" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a class="social-link instagram" data-red="instagram" target="_blank"><i class="fab fa-instagram"></i></a>
            <a class="social-link spotify" data-red="spotify" target="_blank"><i class="fa-brands fa-spotify"></i></a>
            <a class="social-link youtube" data-red="youtube" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </section>
    <section id="historia" class="seccion historia">
        <div class="contenido-seccion">
            <h2>HISTORIA</h2>
            <div class="panel-historia paused">
                <div class="historia-imagen elemento">
                    <img rel="preload" id="historia-imagen" alt="Historia">
                </div>
                <div class="historia-texto elemento">
                    <p id="historia-texto"></p>
                </div>
            </div>
        </div>
    </section>
    <!-- SECCIÓN MÚSICA -->
    <section id="musica" class="seccion musica">
        <div class="fondo">
        </div>
        <div class="contenido-seccion">
            <h2>MÚSICA</h2>
            <!-- SPOTIFY -->
            <div class="panel-musica paused">
                <div class="musica-spotify elemento">
                    <iframe data-testid="embed-iframe" class="iframe-Spotify"
                        src="https://open.spotify.com/embed/artist/1E6vfz0cfHNQIJNtUf2irN?utm_source=generator&theme=0"
                        frameBorder="0"
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy"></iframe>
                </div>
                <!-- IMÁGENES -->
                <div class="musica-discografia elemento">
                    <div class="carrusel-container"></div>
                    <button class="btn-prev">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="grid-discos" id="grid-discos"></div>
                    <button class="btn-next">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>
    <!-- SECCIÓN CONCIERTOS -->
    <section id="conciertos" class="seccion conciertos">
        <div class="contenido-seccion paused">
            <h2>CONCIERTOS</h2>
            <div class="panel-conciertos">
                <script charset="utf-8" src="https://widget.bandsintown.com/main.min.js"></script><a
                    class="bit-widget-initializer" data-artist-name="Rexurgir" data-display-local-dates="false"
                    data-display-past-dates="false" data-auto-style="false" data-text-color="#FFFFFF"
                    data-link-color="#EDD074" data-background-color="rgba(0,0,0,0)" data-display-limit="5"
                    data-link-text-color="#FFFFFF" data-display-lineup="false" data-display-play-my-city="false"
                    data-separator-color="rgba(124,124,124,0.25)" data-display-start-time="false" data-language="es"
                    data-font="Oswald, sans-serif"></a>
            </div>
        </div>
    </section>
    <!-- SECCIÓN CONTACTO -->
    <section id="contacto" class="seccion contacto">
        <div class="contenido-seccion">
            <h2>CONTACTO</h2>
            <div class="panel-contacto paused">
                <div class="redes-contacto">
                    <img id="logo-contacto" alt="Logo de la banda" class="logo-contacto">
                    <div class="platforms">
                        <a class="social-link facebook" data-red="facebook" target="_blank"><i
                                class="fab fa-facebook-f"></i></a>
                        <a class="social-link instagram" data-red="instagram" target="_blank"><i
                                class="fab fa-instagram"></i></a>
                        <a class="social-link spotify" data-red="spotify" target="_blank"><i
                                class="fa-brands fa-spotify"></i></a>
                        <a class="social-link youtube" data-red="youtube" target="_blank"><i
                                class="fa-brands fa-youtube"></i></a>
                    </div>
                </div>
                <div class="barra-vertical"></div>
                <div class="formulario-contacto">
                    <!-- <form action="#" method="post">
                        <input type="text" name="nombre" placeholder="Tu nombre" required>
                        <input type="email" name="email" placeholder="Tu email" required>
                        <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
                        <button type="submit">ENVIAR</button>
                    </form> -->

                    <form name="contacto" method="POST" data-netlify="true" id="form-contacto">
                        <input type="text" name="nombre" placeholder="Tu nombre" required>
                        <input type="email" name="email" placeholder="Tu email" required>
                        <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
                        <button type="submit">ENVIAR</button>
                    </form>

                    <p id="estado-formulario"></p>

                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <p>Rexurgir HC | © <span id="year"></span> </p>
    </footer>
</body>
<!-- JS -->
<script src="js/data-loader.js" defer></script>
<script src="js/header.js" defer></script>
<script src="js/menu.js" defer></script>
<script src="js/revelar.js" defer></script>
<script src="js/ancla.js" defer></script>
<script src="js/carrusel.js" defer></script>
<script src="js/footer.js" defer></script>
<script src="js/mail.js" defer></script>

</html>
