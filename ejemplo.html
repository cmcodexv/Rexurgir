<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Superposición sin contenedor</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .seccion {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .seccion1 {
      background: #4a90e2;
      color: white;
      z-index: 1;
    }

    .seccion2 {
      background: #f5f5f5;
      color: black;
      z-index: 2;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
    }

    .seccion3 {
      background: #ffce54;
      color: black;
      z-index: 3;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
    }

    .seccion4 {
      background: #d9534f;
      color: white;
      z-index: 4;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="seccion seccion1">Sección 1</div>
  <div class="seccion seccion2">Sección 2</div>
  <div class="seccion seccion3">Sección 3</div>
  <div class="seccion seccion4">Sección 4</div>

</body>
</html>
